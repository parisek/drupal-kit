# Feature flags for behaviour drupal_kit ships opt-in, default off.
#
# AGENTS.md § Feature flags & breaking changes: new behaviour a consumer
# could be surprised by never turns itself on. A base class hangs the flag on
# a `protected bool`, a service takes it as a $params key, and behaviour with
# neither — a module-level hook — reads it from here.
#
# Every flag is absent or FALSE in this file. A project turns one on in its
# own config, which is where PORTA's opinionated defaults belong.
features: {}
