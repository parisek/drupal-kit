name: "Drupal Kit"
type: module
description: "Shared PORTA component infrastructure: services, base classes, Twig extensions, image resizer."
core_version_requirement: ^10 || ^11
package: "PORTA"

# The module ships its own interface translations under translations/.
# Drupal's locale module reads them through this project declaration. The
# path here is the usual install location; drupal_kit_locale_translation_
# projects_alter() replaces it with wherever the module really sits, which
# an info file cannot compute. Note %language carries no closing percent.
interface translation project: drupal_kit
interface translation server pattern: modules/contrib/drupal_kit/translations/%language.po

dependencies:
  - drupal:block
  - drupal:components
  - drupal:config_pages
  - drupal:extra_field
  - drupal:twig_real_content
  - drupal:twig_tweak
