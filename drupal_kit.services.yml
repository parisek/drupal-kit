parameters:
  # No procedural hooks left: drupal_kit.module went with the #[Hook]
  # migration and drupal_kit.install with hook_runtime_requirements, so
  # there is nothing for the collector's file scan to find. It was unsafe
  # to set this while .install existed — the flag skips the scan entirely
  # (HookCollectorPass), so hook_requirements would have stopped
  # registering without a word. 74 core modules set it.
  drupal_kit.skip_procedural_hook_scan: true

services:
  # Registered by hand, unlike the other #[Hook] classes, which autowire.
  # Both menu language manipulator services ship with a core patch and are
  # absent on most sites; `@?` is how an argument says "NULL when missing",
  # and no attribute can say that. Hook.php sanctions manual registration
  # for exactly this case.
  Drupal\drupal_kit\Hook\Requirements:
    class: Drupal\drupal_kit\Hook\Requirements
    arguments:
      - "@language_manager"
      - "@?menu.language_tree_manipulator"
      - "@?menu.language_menu_link_tree_manipulator"
  drupal_kit.feature_flags:
    class: Drupal\drupal_kit\Services\FeatureFlags
    arguments:
      - "@config.factory"
  drupal_kit.route_subscriber:
    class: Drupal\drupal_kit\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
  drupal_kit.twig_extension:
    arguments: ["@date.formatter", "@language_manager", "@string_translation"]
    class: Drupal\drupal_kit\TwigExtension
    tags:
      - { name: twig.extension }
  drupal_kit.typography_twig_extension:
    class: Drupal\drupal_kit\Twig\TypographyExtension
    arguments: ["@theme.manager", "@extension.path.resolver", "%app.root%", "@language_manager"]
    tags:
      - { name: twig.extension }
  drupal_kit.vite_manifest:
    class: Drupal\drupal_kit\Services\ViteManifest
    arguments: ["@extension.path.resolver", "@module_handler", "%app.root%", "@logger.factory"]
  drupal_kit.entity_helper:
    class: Drupal\drupal_kit\Services\EntityHelper
    arguments:
      [
        "@entity_type.manager",
        "@current_route_match",
        "@language_manager",
        "@entity.repository",
        "@config.factory",
        "@database",
        "@cache.default",
        "@menu.link_tree",
        "@file_url_generator",
        "@logger.factory",
        "@renderer",
        "@date.formatter",
        "@image.factory",
        "@request_stack",
        "@drupal_kit.menu_active_trail_resolver",
        "@drupal_kit.taxonomy_tree_builder",
        "@drupal_kit.menu_tree_builder",
        "@drupal_kit.media_array_builder",
      ]
  drupal_kit.schedule_announcer:
    class: Drupal\drupal_kit\Services\ScheduleAnnouncer
    arguments:
      # Optional — NULL without the scheduler module, which is the whole
      # opt-in: no module, no messages, no class ever resolved.
      - "@?scheduler.manager"
      - "@date.formatter"
      - "@current_user"
  drupal_kit.taxonomy_tree_builder:
    class: Drupal\drupal_kit\Services\TaxonomyTreeBuilder
    arguments:
      - "@entity_type.manager"
      - "@language_manager"
  drupal_kit.menu_tree_builder:
    class: Drupal\drupal_kit\Services\MenuTreeBuilder
    arguments:
      - "@menu.link_tree"
      - "@drupal_kit.menu_active_trail_resolver"
      - "@language_manager"
      - "@entity_type.manager"
      - "@request_stack"
      # Both optional, both from the hand-applied core patch
      # drupal.org#2466553. Older revisions name it this:
      - "@?menu.language_tree_manipulator"
      # Revision #255 (rerolled for 11.4) renames it to this and makes it
      # a contextual manipulator. Preferred when both are present.
      - "@?menu.language_menu_link_tree_manipulator"
  drupal_kit.media_array_builder:
    class: Drupal\drupal_kit\Services\MediaArrayBuilder
    arguments:
      - "@language_manager"
      - "@image.factory"
      - "@logger.factory"
      - "@cache.default"
      - "@file_url_generator"
  drupal_kit.config_applier:
    class: Drupal\drupal_kit\Services\ConfigApplier
    arguments:
      - "@config.factory"
      - "@config.manager"
      - "@config.storage"
      - "@entity_type.manager"
  # drupal_kit.resizer was removed in v1.4.0. Resizer is
  # a static utility — call \Drupal\drupal_kit\Services\Resizer::resizer()
  # directly. TwigExtension::getResizer does this.
  drupal_kit.menu_active_trail_resolver:
    class: Drupal\drupal_kit\Services\MenuActiveTrailResolver
    arguments:
      - "@menu.active_trail"
      - "@plugin.manager.menu.link"
      - "@breadcrumb"
      - "@current_route_match"
